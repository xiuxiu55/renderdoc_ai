[project]
name = "renderdoc-mcp"
version = "0.1.0"
description = "A Model Context Protocol server for RenderDoc capture analysis"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["mcp>=1.2.0"]

[project.scripts]
renderdoc-mcp = "renderdoc_mcp.server:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["server", "rd_session"]
